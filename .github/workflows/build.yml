name: Build & Package Vahti

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Notarize with Apple (requires secrets)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VAHTI_LANGUAGES: 'en,hr'

jobs:
  build:
    name: Build macOS App & DMG
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Bun
        # npm, not oven-sh/setup-bun: the action downloads Bun from the oven-sh/bun
        # GitHub release assets, which have been serving 504s; the npm registry is
        # already needed for daemon dependencies, so this adds no new dependency.
        run: npm install -g bun

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure test environment
        run: |
          defaults write -g AppleLanguages -array "en" "hr"

      - name: Install daemon dependencies
        run: |
          npm --prefix daemon ci

      - name: Run daemon tests
        run: |
          npm --prefix daemon test

      - name: Set up Apple Code Signing & Notarization
        id: certs
        env:
          BUILD_CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_P12 }}
          P12_PWD: ${{ secrets.P12_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'LWSR8T5392' }}
        run: |
          if [ -n "$BUILD_CERT_BASE64" ] && [ -n "$P12_PWD" ]; then
            echo "Configuring Apple Developer ID Certificate..."
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PWD=$(openssl rand -base64 32)
            CERT_PATH=$RUNNER_TEMP/developer_id.p12

            echo "$BUILD_CERT_BASE64" | base64 --decode > "$CERT_PATH"

            security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

            security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PWD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

            security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
            security default-keychain -s "$KEYCHAIN_PATH"
            echo "has_cert=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing certificate secret found; build will use ad-hoc / local signing."
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "Configuring Apple ID for Notarization..."
            xcrun notarytool store-credentials "vahti" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD"
            echo "has_notary=true" >> "$GITHUB_OUTPUT"
          else
            echo "No notarytool secrets found."
            echo "has_notary=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Package App
        run: |
          SHOULD_NOTARIZE="${{ (github.event_name == 'workflow_dispatch' && inputs.notarize) || startsWith(github.ref, 'refs/tags/v') }}"
          if [ "$SHOULD_NOTARIZE" = "true" ]; then
            if [ "${{ steps.certs.outputs.has_cert }}" != "true" ] || [ "${{ steps.certs.outputs.has_notary }}" != "true" ]; then
              echo "::error::Notarized builds require both Developer ID certificate and notary credentials."
              exit 1
            fi
            echo "==> Building Release Package (Notarized)..."
            scripts/package-app.sh --release
          else
            echo "==> Building Package (Self-contained, non-notarized test build)..."
            scripts/package-app.sh
          fi

      # No workflow artifacts: public standard-runner builds are free, but
      # artifact retention is separately metered. Deliver only to Releases.
      - name: Verify and name the notarized download
        if: (github.event_name == 'workflow_dispatch' && inputs.notarize) || startsWith(github.ref, 'refs/tags/v')
        run: |
          bash scripts/verify-notarized.sh dist/Vahti.dmg
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/Info.plist)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            name="Vahti-$version-manual.${{ github.run_number }}-macos-arm64.dmg"
          else
            name="Vahti-$version-macos-arm64.dmg"
          fi
          mkdir -p release
          cp dist/Vahti.dmg "release/$name"
          (cd release && shasum -a 256 "$name" > "$name.sha256")
          echo "Verified download: $name"
          cat "release/$name.sha256"

      - name: Deliver manual notarized DMG to draft release
        if: github.event_name == 'workflow_dispatch' && inputs.notarize
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-vahti
          target_commitish: ${{ github.sha }}
          name: Vahti manual builds
          body: |
            Notarized Apple Silicon builds from manual runs. Download the newest numbered DMG and its SHA256 file.
          draft: true
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
